name: Investigate full Blender startup in Apple WebKit
on:
  push:
    branches: [codex/ipad-native-webkit-replay]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-replay:
    runs-on: macos-15
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        registry: [array, dictionary]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install current Apple WebKit replay runner
        run: |
          python3 -m venv .cache/browser-tests
          .cache/browser-tests/bin/python -m pip install playwright==1.62.0
          .cache/browser-tests/bin/python -m playwright install webkit
      - name: Retrieve the exact accepted v5 full runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '12019222064'
          github-token: ${{ github.token }}
          run-id: '38835939241'
          path: work/accepted-v5
          merge-multiple: true
      - name: Replay actual engine with bridge checkpoints
        timeout-minutes: 6
        run: .cache/browser-tests/bin/python tests/ipad_native_webkit_replay.py --input-dir work/accepted-v5 --registry ${{ matrix.registry }}
      - name: Preserve the full engine replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-webkit-${{ matrix.registry }}-evidence
          path: work/native-webkit-replay/${{ matrix.registry }}/*
          if-no-files-found: error
