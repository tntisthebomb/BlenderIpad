name: Validate experimental Blender browser editor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare pinned browser runtime and graphics compilers
        run: |
          python3 scripts/build_browser_platform.py
          python3 scripts/build_browser_core_deps.py
          python3 scripts/build_browser_python.py
          python3 scripts/build_browser_python_probe.py
          python3 scripts/build_browser_shaderc.py
          python3 scripts/test_browser_shaderc.py
          python3 scripts/build_browser_tint.py
          python3 scripts/test_browser_tint.py
      - name: Build and validate the actual native application
        run: |
          python3 scripts/build_blender_core.py --editor
          python3 scripts/test_blender_core.py --webgpu
          python3 scripts/build_blender_core_browser.py --editor
      - name: Install browser acceptance runner
        run: |
          python3 -m venv .cache/browser-tests
          .cache/browser-tests/bin/python -m pip install playwright==1.62.0 Pillow==12.0.0
      - name: Validate and record the exact editor assets
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: python3 scripts/validate_blender_editor.py
      - name: Package accepted editor and corresponding source
        run: python3 scripts/package_blender_editor.py
      - name: Upload experimental editor and corresponding source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blender-editor-preview-with-source
          path: dist/*
          if-no-files-found: error
      - name: Preserve acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blender-editor-diagnostics
          path: |
            .cache/blender-gpu-browser-console.log
            .cache/blender-editor-browser-log.json
            .cache/blender-editor-frame.png
          if-no-files-found: ignore
