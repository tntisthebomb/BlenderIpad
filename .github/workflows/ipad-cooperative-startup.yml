name: Validate cooperative Blender startup

on:
  push:
    branches: [codex/ipad-cooperative-startup]
    paths:
      - '.github/workflows/ipad-cooperative-startup.yml'
      - 'patches/**'
      - 'cmake/**'
      - 'native/browser/webgpu/**'
      - 'native/browser/GHOST*'
      - 'native/browser/*.cc'
      - 'native/browser/core_browser_env.js'
      - 'native/browser/editor_browser_env.js'
      - 'browser-port.lock.json'
      - 'port.lock.json'
      - 'scripts/build_blender_core.py'
      - 'scripts/setup_browser.py'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ipad-interactive-performance
  cancel-in-progress: true

jobs:
  cancel-obsolete:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Stop the superseded first candidate build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          url='https://api.github.com/repos/tntisthebomb/BlenderIpad/actions/runs/38989434384'
          headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as response:
              status=json.load(response)['status']
          if status in ('queued','in_progress','waiting'):
              try:
                  urllib.request.urlopen(urllib.request.Request(url+'/cancel',headers=headers,method='POST')).close()
                  print('Stopped superseded candidate build.')
              except urllib.error.HTTPError as error:
                  if error.code!=409:raise
          PY
  editor:
    needs: cancel-obsolete
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    strategy:
      fail-fast: false
      matrix:
        profile: [cpu-cycles]
    steps:
      - name: Check out project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Record builder memory
        run: free -h
      - name: Restore pinned compiler and incremental objects
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache
          key: cooperative-v1-${{ runner.os }}-${{ matrix.profile }}-${{ hashFiles('port.lock.json', 'browser-port.lock.json') }}-${{ github.sha }}
          restore-keys: |
            cooperative-v1-${{ runner.os }}-${{ matrix.profile }}-${{ hashFiles('port.lock.json', 'browser-port.lock.json') }}-c24201df702a4ce4a7a055c71d2cbd683e237f60
            cooperative-v1-${{ runner.os }}-${{ matrix.profile }}-${{ hashFiles('port.lock.json', 'browser-port.lock.json') }}-8eb8d406680e26746331748371928cd3b8064328
            cooperative-v1-${{ runner.os }}-${{ matrix.profile }}-${{ hashFiles('port.lock.json', 'browser-port.lock.json') }}-7f940bc0fa86c69216122b6407c57acee0477d9b
            cooperative-v1-${{ runner.os }}-${{ matrix.profile }}-${{ hashFiles('port.lock.json', 'browser-port.lock.json') }}-2de544a4dafed1502827f04aca876c95a0a71f59
            cooperative-v1-${{ runner.os }}-${{ matrix.profile }}-${{ hashFiles('port.lock.json', 'browser-port.lock.json') }}-
            browser-v2-${{ runner.os }}-${{ matrix.profile }}-${{ hashFiles('port.lock.json', 'browser-port.lock.json') }}-
            browser-v2-${{ runner.os }}-${{ matrix.profile }}-
            browser-v2-${{ runner.os }}-webgpu-${{ hashFiles('port.lock.json', 'browser-port.lock.json') }}-
      - name: Verify accepted dependency content for an incremental native build
        id: native-dependencies
        env:
          RESTORED_NATIVE_CACHE: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: python3 scripts/verify_cached_native_dependencies.py
      - name: Install browser acceptance runner
        run: |
          python3 -m venv .cache/browser-tests
          .cache/browser-tests/bin/python -m pip install playwright==1.62.0 Pillow==12.0.0
      - name: Build and verify actual native suspension
        run: |
          if [ '${{ steps.native-dependencies.outputs.reuse }}' != 'true' ]; then python3 scripts/build_startup_yield_probe.py; fi
          .cache/browser-tests/bin/python tests/startup_yield_browser_test.py
      - name: Build and verify WebGPU canvas lifecycle
        run: |
          if [ '${{ steps.native-dependencies.outputs.reuse }}' != 'true' ]; then python3 scripts/build_browser_ghost_webgpu.py; fi
          .cache/browser-tests/bin/python tests/ghost_webgpu_browser_test.py
      - name: Build production buffer-pool ordering probe
        run: python3 scripts/build_frame_buffer_pool_probe.py
      - name: Build and verify native event routing and startup guard
        run: |
          if [ '${{ steps.native-dependencies.outputs.reuse }}' != 'true' ]; then python3 scripts/build_browser_platform.py; fi
          .cache/browser-tests/bin/python tests/ghost_platform_test.py
      - name: Prepare pinned native dependencies
        if: steps.native-dependencies.outputs.reuse != 'true'
        run: python3 scripts/build_browser_core_deps.py
      - name: Build and verify embedded Python
        run: |
          if [ '${{ steps.native-dependencies.outputs.reuse }}' != 'true' ]; then
            python3 scripts/build_browser_python.py
            python3 scripts/build_browser_python_probe.py
            python3 scripts/build_python_startup_yield_probe.py
          fi
          .cache/browser-tests/bin/python tests/python_startup_yield_browser_test.py
      - name: Build and verify GLSL compiler
        run: |
          if [ '${{ steps.native-dependencies.outputs.reuse }}' != 'true' ]; then python3 scripts/build_browser_shaderc.py; fi
          python3 scripts/test_browser_shaderc.py
      - name: Build and verify WGSL compiler
        run: |
          if [ '${{ steps.native-dependencies.outputs.reuse }}' != 'true' ]; then python3 scripts/build_browser_tint.py; fi
          python3 scripts/test_browser_tint.py
      - name: Verify shader semantics and native lifecycle
        run: |
          .cache/browser-tests/bin/python tests/shader_semantics_browser_test.py
          .cache/browser-tests/bin/python scripts/test_browser_lifecycle.py
      - name: Build and verify subdivision library
        if: steps.native-dependencies.outputs.reuse != 'true'
        run: python3 scripts/build_browser_opensubdiv.py
      - name: Validate the real CPU scheduler
        if: matrix.profile == 'cpu-cycles' && steps.native-dependencies.outputs.reuse != 'true'
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          python3 scripts/build_browser_tbb.py
      - name: Build and validate the actual native application
        run: |
          python3 scripts/test_browser_binaryen.py
          if [ '${{ matrix.profile }}' = 'cpu-cycles' ]; then
            python3 scripts/build_blender_core.py --editor --cycles
          else
            python3 scripts/build_blender_core.py --editor
          fi
          python3 scripts/test_blender_core.py --webgpu
          python3 scripts/build_blender_core_browser.py --editor
      - name: Capture shader translations from the new native engine
        run: |
          mkdir -p work
          .cache/browser-tests/bin/python tests/blender_tablet_startup_browser_test.py --no-shader-seed --interact --slow-readback --capture-shaders work/native-startup-shaders.json
          python3 scripts/generate_startup_shader_seed.py --capture work/native-startup-shaders.json
      - name: Validate and record the exact editor assets
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          if [ '${{ matrix.profile }}' = 'cpu-cycles' ]; then
            python3 scripts/validate_blender_editor.py --eevee --cycles
          else
            python3 scripts/validate_blender_editor.py --eevee
          fi
      - name: Package accepted editor and corresponding source
        run: python3 scripts/package_blender_editor.py
      - name: Stage accepted flat cooperative runtime
        run: python3 scripts/stage_cooperative_runtime.py
      - name: Upload accepted flat cooperative runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Blender-iPad-cooperative-startup-full
          path: work/cooperative-runtime/*
          if-no-files-found: error
      - name: Upload experimental editor and corresponding source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blender-editor-${{ matrix.profile }}-with-source
          path: dist/*
          if-no-files-found: error
      - name: Preserve Python suspension probe for Apple WebKit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-startup-yield-probe
          path: .cache/python-startup-yield-probe/*
          if-no-files-found: ignore
      - name: Preserve native yield probe for Apple WebKit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-yield-probe
          path: .cache/startup-yield-probe/*
          if-no-files-found: ignore
      - name: Preserve acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blender-editor-${{ matrix.profile }}-diagnostics
          include-hidden-files: true
          path: |
            .cache/blender-gpu-browser-console.log
            .cache/blender-editor-browser-log.json
            .cache/blender-editor-frame.png
            .cache/blender-tablet-startup-*
            .cache/blender-render-*.png
            .cache/blender-render-*-console.log
            .cache/blender-modeling-console.log
            .cache/blender-webgpu-browser/editor-failures.json
            .cache/blender-webgpu-build/core-validation.json
          if-no-files-found: ignore
      - name: Preserve candidate runtime and corresponding source for failed-test diagnosis
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unaccepted-runtime-${{ matrix.profile }}
          include-hidden-files: true
          path: |
            .cache/blender-webgpu-browser
            .cache/blender-webgpu-build/bin/blender.js
            .cache/blender-webgpu-build/bin/blender.wasm
          if-no-files-found: ignore
      - name: Preserve corresponding prepared source for failed-test diagnosis
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unaccepted-source-${{ matrix.profile }}
          path: |
            .cache/blender-browser
            .cache/deps-src
            .cache/graphics-src
            .cache/deps-build/openimageio-threaded/port-source
            .cache/deps-build/pystring-threaded/source
            .cache/tint-patched-source
            .cache/emsdk/upstream/emscripten/system
            .cache/emsdk/upstream/emscripten/src
            .cache/emsdk/upstream/emscripten/LICENSE
          if-no-files-found: ignore
      - name: Save incremental build for follow-up fixes
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  webkit-suspension:
    needs: editor
    if: always()
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-yield-probe
          path: .cache/startup-yield-probe
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-startup-yield-probe
          path: .cache/python-startup-yield-probe
      - name: Install Apple WebKit test runner
        run: |
          python3 -m venv .cache/browser-tests
          .cache/browser-tests/bin/python -m pip install playwright==1.62.0
          .cache/browser-tests/bin/python -m playwright install webkit
      - name: Verify actual native suspension and independent recovery
        run: |
          .cache/browser-tests/bin/python tests/startup_yield_browser_test.py --browser webkit
          .cache/browser-tests/bin/python tests/python_startup_yield_browser_test.py --browser webkit
          .cache/browser-tests/bin/python tests/startup_watchdog_browser_test.py --browser webkit
          .cache/browser-tests/bin/python tests/startup_shader_cache_browser_test.py --browser webkit
          .cache/browser-tests/bin/python tests/tablet_touch_browser_test.py --browser webkit
