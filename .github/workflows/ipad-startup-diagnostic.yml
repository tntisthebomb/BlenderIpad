name: Validate and package engine-free iPad helpers
on:
  push:
    branches: [codex/ipad-startup-diagnostic]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install helper test runner
        run: |
          python3 -m venv /tmp/blender-helper-tests
          /tmp/blender-helper-tests/bin/python -m pip install playwright==1.62.0
      - name: Validate real service-worker update and rollback without an engine
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: /tmp/blender-helper-tests/bin/python diagnostics/test_updater.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ipad-startup-check
          path: |
            diagnostics/ipad-startup.html
            diagnostics/ipad-update.html
            diagnostics/README.txt
          if-no-files-found: error
