name: Validate full Blender GPU command and recovery diagnostics
on:
  push:
    branches: [codex/ipad-command-trace]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recovery-webkit:
    # Apple WebKit exposes the same storage API family as Safari on iPad.
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install WebKit recovery runner
        run: |
          python3 -m venv .cache/browser-tests
          .cache/browser-tests/bin/python -m pip install playwright==1.62.0
          .cache/browser-tests/bin/python -m playwright install webkit
      - name: Verify recorder recovery in WebKit without loading Blender
        timeout-minutes: 3
        run: .cache/browser-tests/bin/python tests/startup_watchdog_browser_test.py --browser webkit
      - name: Preserve WebKit recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WebKit-recovery-evidence
          path: work/memory/watchdog-webkit-evidence.json
          if-no-files-found: ignore
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install actual editor acceptance runner
        run: |
          python3 -m venv .cache/browser-tests
          .cache/browser-tests/bin/python -m pip install playwright==1.62.0 Pillow==12.0.0
      - name: Retrieve exact accepted v4 engine and proof
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: '12009219523'
          github-token: ${{ github.token }}
          run-id: '38813101042'
          path: work/v4
          merge-multiple: true
      - name: Verify every v4 asset and prepare diagnostics
        run: python3 scripts/prepare_gpu_command_trace.py --input-dir work/v4 --output .cache/blender-webgpu-browser
      - name: Verify GPU call trace, blocked-page recovery and actual editor
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: .cache/browser-tests/bin/python scripts/validate_gpu_command_trace.py
      - name: Upload small update using existing engine files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blender-iPad-command-trace-update
          path: work/gpu-command-trace-update/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload full replacement folder
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blender-iPad-command-trace-full
          path: .cache/blender-webgpu-browser/*
          if-no-files-found: error
          retention-days: 30
      - name: Preserve actual editor and recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: command-trace-evidence
          include-hidden-files: true
          path: |
            .cache/blender-editor-frame.png
            .cache/blender-editor-browser-log.json
            .cache/blender-tablet-startup-*
            work/memory/watchdog-chromium-evidence.json
          if-no-files-found: ignore
