name: Recover exact failed editor for local diagnosis
on:
  push:
    branches: [codex/ipad-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unaccepted-debug-cpu-cycles
          github-token: ${{ github.token }}
          run-id: 38540158181
          path: work/failed
      - name: Identify the failed source and runtime
        run: |
          mkdir -p diagnostic
          printf '%s\n' 'UNACCEPTED diagnostic runtime from source 5999676c4ef42bac96a5db416b90c139af8fdf10, run 38540158181, cpu-cycles profile.' > diagnostic/PROVENANCE.txt
          cp work/failed/blender-webgpu-browser/editor-failures.json diagnostic/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unaccepted-runtime-only-5999676-cpu-cycles
          include-hidden-files: true
          path: |
            diagnostic
            work/failed/blender-webgpu-browser
            work/failed/blender-webgpu-build/bin/blender.js
            work/failed/blender-webgpu-build/bin/blender.wasm
          if-no-files-found: error
