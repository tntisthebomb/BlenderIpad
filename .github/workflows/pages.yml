name: Build iPad workbench

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Publish to GitHub Pages (requires Pages already enabled)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build pinned Blender math source
        run: python3 scripts/build_kernel.py
      - name: Validate compiled WebAssembly
        run: node --test tests/math.test.mjs
      - name: Upload local-server ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ipad-workbench
          path: web
          if-no-files-found: error
      - name: Upload optional Pages package
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
