<script>
'use strict';
const cases=JSON.parse(document.getElementById('shader-cases').textContent);
const report={diagnostic:'ipad-outline-compiler-v1',engineStarted:false,
  engineSource:'893f6163652f5cde223f9781a61ef4931f4b3444',
  url:location.href,userAgent:navigator.userAgent,secureContext:isSecureContext,
  webGPU:!!navigator.gpu,results:[],errors:[]};
const output=document.getElementById('report'),message=document.getElementById('message');
function refresh(){
  output.value=JSON.stringify(report,null,2);
  try{localStorage.setItem('blender-outline-check-last',output.value);}catch{}
}
function errorText(error){
  const text=String(error?.message || error);
  const separator=text.lastIndexOf(' - error ');
  const useful=separator>=0 ? text.slice(separator+9) : text;
  return useful.length>12000 ? useful.slice(0,1000)+'\n[details omitted]\n'+useful.slice(-11000) : useful;
}
refresh();
document.getElementById('check').onclick=async()=>{
  document.getElementById('check').disabled=true;
  let device,timer,timeout=false;
  const expired=new Promise((_,reject)=>{timer=setTimeout(()=>{
    timeout=true;device?.destroy();reject(new Error('Shader check timed out. It will not retry.'));
  },30000);});
  const bounded=operation=>Promise.race([operation,expired]);
  try{
    if(!isSecureContext) throw new Error('Open this file through WorldWideWeb at http://localhost:8080/.');
    if(!navigator.gpu) throw new Error('WebGPU is unavailable.');
    message.textContent='Checking graphics adapter — Blender is not loading.';
    const adapter=await bounded(navigator.gpu.requestAdapter({powerPreference:'low-power'}));
    if(!adapter) throw new Error('No graphics adapter was available.');
    const pendingDevice=adapter.requestDevice();
    // If adapter/device creation outlives the deadline, retire the late device.
    pendingDevice.then(value=>{if(timeout)value.destroy();},()=>{});
    device=await bounded(pendingDevice);
    device.addEventListener('uncapturederror',event=>{
      event.preventDefault();report.errors.push(errorText(event.error));refresh();
    });
    device.lost.then(info=>{
      if(info.reason!=='destroyed') {report.errors.push('Device lost: '+info.message);refresh();}
    });
    const vertex=device.createShaderModule({label:'outline-check-fullscreen',code:`
      @vertex fn main(@builtin(vertex_index) index:u32)->@builtin(position) vec4<f32>{
        let x=f32((index<<1u)&2u);let y=f32(index&2u);
        return vec4<f32>(x*2.0-1.0,y*2.0-1.0,0.0,1.0);
      }`});
    const group=device.createBindGroupLayout({entries:[
      {binding:0,visibility:GPUShaderStage.FRAGMENT,texture:{sampleType:'uint'}},
      {binding:1,visibility:GPUShaderStage.FRAGMENT,buffer:{type:'uniform',minBindingSize:352}},
      {binding:128,visibility:GPUShaderStage.FRAGMENT,sampler:{type:'non-filtering'}}]});
    const layout=device.createPipelineLayout({bindGroupLayouts:[group]});
    for(const test of cases){
      message.textContent='Compiling '+test.name+' — Blender is not loading.';
      const result={name:test.name,sha256:test.sha256};
      report.results.push(result);refresh();
      try{
        const fragment=device.createShaderModule({label:test.name,code:test.code});
        await bounded(device.createRenderPipelineAsync({label:test.name,layout,
          vertex:{module:vertex,entryPoint:'main'},
          fragment:{module:fragment,entryPoint:'main',targets:[{format:'rgba16float'}]},
          primitive:{topology:'triangle-list'}}));
        result.compiled=true;
      }catch(error){result.compiled=false;result.error=errorText(error);}
      refresh();
      if(timeout)break;
    }
    message.textContent='Check finished. Blender has not loaded. Copy this report and send it in the chat.';
  }catch(error){report.errors.push(errorText(error));message.textContent=errorText(error);}
  finally{clearTimeout(timer);device?.destroy();refresh();}
};
document.getElementById('copy').onclick=async()=>{
  output.focus();output.select();output.setSelectionRange(0,output.value.length);
  try{await navigator.clipboard.writeText(output.value);message.textContent='Report copied. Paste it into the chat.';}
  catch{message.textContent='Report selected. Touch and hold the selection, then choose Copy.';}
};
document.getElementById('download').onclick=()=>{
  const url=URL.createObjectURL(new Blob([output.value],{type:'application/json'}));
  const link=document.createElement('a');link.href=url;link.download='BlenderIpad-outline-check.json';
  document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
};
</script>
</html>
