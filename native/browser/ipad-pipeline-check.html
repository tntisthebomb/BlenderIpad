<script>
'use strict';
const fixture=JSON.parse(document.getElementById('captured-pipeline').textContent);
const report={diagnostic:'ipad-outline-pipeline-v2',engineStarted:false,
  engineSource:fixture.engineSource,fragmentSHA256:fixture.fragmentSHA256,vertexSHA256:fixture.vertexSHA256,
  url:location.href,userAgent:navigator.userAgent,secureContext:isSecureContext,
  webGPU:!!navigator.gpu,results:[],errors:[]};
const output=document.getElementById('report'),message=document.getElementById('message');
function refresh(){
  output.value=JSON.stringify(report,null,2);
  try{localStorage.setItem('blender-pipeline-check-last',output.value);}catch{}
}
function errorText(error){
  const text=String(error?.message || error);
  const separator=text.lastIndexOf(' - error ');
  const useful=separator>=0 ? text.slice(separator+9) : text;
  return useful.length>6000 ? useful.slice(0,1000)+'\n[details omitted]\n'+useful.slice(-5000) : useful;
}
refresh();
document.getElementById('check').onclick=async()=>{
  document.getElementById('check').disabled=true;
  let device,timer,timeout=false,deviceLost=false;
  const expired=new Promise((_,reject)=>{timer=setTimeout(()=>{
    timeout=true;device?.destroy();reject(new Error('Pipeline check timed out. It will not retry.'));
  },30000);});
  const bounded=operation=>Promise.race([operation,expired]);
  try{
    if(!isSecureContext)throw new Error('Open this file through WorldWideWeb at http://localhost:8080/.');
    if(!navigator.gpu)throw new Error('WebGPU is unavailable.');
    message.textContent='Checking adapter — Blender is not loading.';
    const adapter=await bounded(navigator.gpu.requestAdapter());
    if(!adapter)throw new Error('No graphics adapter was available.');
    const features=['float32-filterable','depth32float-stencil8','indirect-first-instance'].filter(f=>adapter.features.has(f));
    const caps={maxStorageTexturesPerShaderStage:16,maxStorageBuffersPerShaderStage:32,
      maxUniformBuffersPerShaderStage:32,maxSampledTexturesPerShaderStage:32,maxSamplersPerShaderStage:32,
      maxBufferSize:1073741824,maxStorageBufferBindingSize:1073741824};
    const limits={};
    for(const name of ['maxComputeInvocationsPerWorkgroup','maxComputeWorkgroupSizeX',
      'maxComputeWorkgroupSizeY','maxComputeWorkgroupSizeZ','maxComputeWorkgroupStorageSize',
      'maxStorageTexturesPerShaderStage','maxStorageBuffersPerShaderStage',
      'maxUniformBuffersPerShaderStage','maxSampledTexturesPerShaderStage',
      'maxSamplersPerShaderStage','maxColorAttachments','maxColorAttachmentBytesPerSample',
      'maxStorageBufferBindingSize','maxUniformBufferBindingSize','maxBufferSize']){
      if(typeof adapter.limits[name]==='number')limits[name]=Math.min(adapter.limits[name],caps[name]??adapter.limits[name]);
    }
    report.requestedFeatures=features;report.requestedLimits=limits;refresh();
    for(const profile of ['default-device','engine-device']){
      // An adapter may be consumed by its first requestDevice call.
      const selected=profile==='default-device'?adapter:await bounded(navigator.gpu.requestAdapter());
      if(!selected)throw new Error('No graphics adapter was available for '+profile);
      const pending=selected.requestDevice(profile==='engine-device'?{requiredFeatures:features,requiredLimits:limits}:{});
      pending.then(value=>{if(timeout)value.destroy();},()=>{});
      device=await bounded(pending);deviceLost=false;
      device.addEventListener('uncapturederror',event=>{
        event.preventDefault();report.errors.push(errorText(event.error));refresh();
      });
      device.lost.then(info=>{
        if(info.reason!=='destroyed'){deviceLost=true;report.errors.push('Device lost: '+info.message);refresh();}
      });
      // The captured descriptor includes Blender's actual vertex, fragment,
      // filtering sampler layout, buffer bounds, winding and alpha blending.
      const captured=fixture.descriptor;
      const vertex=device.createShaderModule(captured.vertex.module);
      const fragment=device.createShaderModule(captured.fragment.module);
      for(const mode of ['synchronous','asynchronous']){
        const name=profile+'/'+mode;message.textContent='Checking '+name+' — Blender is not loading.';
        const result={name,compiled:false,errors:[]};report.results.push(result);refresh();
        for(const filter of ['validation','internal','out-of-memory'])device.pushErrorScope(filter);
        try{
          const groups=captured.layout.bindGroupLayouts.map(d=>device.createBindGroupLayout(d));
          const layout=device.createPipelineLayout({bindGroupLayouts:groups});
          const descriptor={...captured,label:'outline-check-'+name,layout,
            vertex:{...captured.vertex,module:vertex},fragment:{...captured.fragment,module:fragment}};
          if(mode==='synchronous')device.createRenderPipeline(descriptor);
          else await bounded(device.createRenderPipelineAsync(descriptor));
        }catch(error){result.errors.push(errorText(error));}
        finally{
          for(let i=0;i<3;i++){
            try{const error=await bounded(device.popErrorScope());if(error)result.errors.push(errorText(error));}
            catch(error){result.errors.push(errorText(error));}
          }
        }
        result.compiled=!timeout&&!deviceLost&&!result.errors.length;refresh();
        if(timeout||deviceLost)break;
      }
      device.destroy();device=null;
      if(timeout||deviceLost)break;
    }
    message.textContent='Check finished. Blender has not loaded. Copy the report and send it in the chat.';
  }catch(error){report.errors.push(errorText(error));message.textContent=errorText(error);}
  finally{clearTimeout(timer);device?.destroy();refresh();}
};
document.getElementById('copy').onclick=async()=>{
  output.focus();output.select();output.setSelectionRange(0,output.value.length);
  try{await navigator.clipboard.writeText(output.value);message.textContent='Report copied. Paste it into the chat.';}
  catch{message.textContent='Report selected. Touch and hold the selection, then choose Copy.';}
};
document.getElementById('download').onclick=()=>{
  const url=URL.createObjectURL(new Blob([output.value],{type:'application/json'}));
  const link=document.createElement('a');link.href=url;link.download='BlenderIpad-pipeline-check.json';
  document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
};
</script>
